<div align="center">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto" style="max-width: 800px;">
    <defs>
      <style>
        /* === AWAN BERGERAK === */
        .awan-atas {
          animation: melayang 12s ease-in-out infinite alternate;
        }
        .awan-bawah {
          animation: melayang 15s ease-in-out infinite alternate-reverse;
        }
        @keyframes melayang {
          0% { transform: translateX(0px); }
          100% { transform: translateX(-40px); }
        }

        /* === HUJAN TURUN === */
        .hujan {
          stroke: #7a9cce;
          stroke-width: 1.5;
          stroke-linecap: round;
          animation: jatuh 0.6s linear infinite;
        }
        @keyframes jatuh {
          0% { transform: translateY(-30px); opacity: 0; }
          10% { opacity: 0.7; }
          90% { opacity: 0.7; }
          100% { transform: translateY(160px); opacity: 0; }
        }

        /* === PETIR BERKEDIP === */
        .petir-utama {
          stroke: #fff7a8;
          stroke-width: 3;
          fill: none;
          stroke-linejoin: round;
          stroke-linecap: round;
          animation: kilat 3.5s infinite;
        }
        .petir-cabang {
          stroke: #ffe066;
          stroke-width: 1.5;
          fill: none;
          stroke-linejoin: round;
          stroke-linecap: round;
          animation: kilat 3.5s infinite 0.1s;
        }
        @keyframes kilat {
          0%, 83%, 85%, 87%, 89%, 91%, 93%, 95%, 100% { opacity: 0; }
          84% { opacity: 1; }
          86% { opacity: 0.3; }
          88% { opacity: 1; }
          90% { opacity: 0; }
          92% { opacity: 0.8; }
          94% { opacity: 0; }
        }

        /* === KEDIPAN LATAR SAAT PETIR === */
        .latar-belakang {
          animation: redup 3.5s infinite;
        }
        @keyframes redup {
          0%, 83%, 85%, 87%, 89%, 91%, 93%, 95%, 100% { fill: #0b0e1a; }
          84%, 88%, 92% { fill: #1a1f2e; }
        }

        /* === TEKS BERKEDIP === */
        .teks-utama {
          animation: teks-hidup 2s ease-in-out infinite alternate;
        }
        @keyframes teks-hidup {
          0% { opacity: 0.7; }
          100% { opacity: 1; }
        }
        .teks-sub {
          animation: teks-hidup 2s ease-in-out infinite alternate-reverse;
        }
      </style>
    </defs>

    <!-- BACKGROUND -->
    <rect class="latar-belakang" width="800" height="200" fill="#0b0e1a" />

    <!-- AWAN ATAS (bergerak ke kiri) -->
    <g class="awan-atas">
      <ellipse cx="200" cy="50" rx="100" ry="40" fill="#1a1f2e" />
      <ellipse cx="320" cy="40" rx="80" ry="35" fill="#151a28" />
      <ellipse cx="480" cy="55" rx="90" ry="38" fill="#1a1f2e" />
      <ellipse cx="600" cy="45" rx="70" ry="30" fill="#131826" />
    </g>

    <!-- AWAN BAWAH (bergerak ke kanan) -->
    <g class="awan-bawah">
      <ellipse cx="150" cy="70" rx="110" ry="30" fill="#0f131f" />
      <ellipse cx="400" cy="75" rx="130" ry="35" fill="#0d111c" />
      <ellipse cx="650" cy="70" rx="100" ry="28" fill="#0f131f" />
    </g>

    <!-- HUJAN (delay berbeda-beda) -->
    <g>
      <line class="hujan" x1="80" y1="90" x2="70" y2="120" style="animation-delay: 0s;" />
      <line class="hujan" x1="180" y1="95" x2="170" y2="125" style="animation-delay: 0.15s;" />
      <line class="hujan" x1="280" y1="85" x2="270" y2="115" style="animation-delay: 0.3s;" />
      <line class="hujan" x1="380" y1="80" x2="370" y2="110" style="animation-delay: 0.45s;" />
      <line class="hujan" x1="480" y1="90" x2="470" y2="120" style="animation-delay: 0.1s;" />
      <line class="hujan" x1="580" y1="95" x2="570" y2="125" style="animation-delay: 0.25s;" />
      <line class="hujan" x1="680" y1="85" x2="670" y2="115" style="animation-delay: 0.4s;" />
      <line class="hujan" x1="130" y1="60" x2="120" y2="90" style="animation-delay: 0.55s;" />
      <line class="hujan" x1="230" y1="55" x2="220" y2="85" style="animation-delay: 0.2s;" />
      <line class="hujan" x1="330" y1="70" x2="320" y2="100" style="animation-delay: 0.35s;" />
      <line class="hujan" x1="430" y1="65" x2="420" y2="95" style="animation-delay: 0.05s;" />
      <line class="hujan" x1="530" y1="60" x2="520" y2="90" style="animation-delay: 0.5s;" />
      <line class="hujan" x1="630" y1="75" x2="620" y2="105" style="animation-delay: 0.15s;" />
      <line class="hujan" x1="730" y1="80" x2="720" y2="110" style="animation-delay: 0.3s;" />
    </g>

    <!-- PETIR UTAMA + CABANG -->
    <polyline class="petir-utama" points="380,20 360,80 395,85 340,160" />
    <polyline class="petir-cabang" points="360,80 385,100 375,120" />
    <polyline class="petir-cabang" points="395,85 415,105 405,135" />

    <!-- TEKS UTAMA -->
    <text class="teks-utama" x="400" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9" letter-spacing="3">
      ⚡ FULL-STACK DEVELOPER ⚡
    </text>
    
    <!-- SUB-TEKS -->
    <text class="teks-sub" x="400" y="185" font-family="Arial, sans-serif" font-size="12" fill="#a0b4d6" text-anchor="middle" opacity="0.7" letter-spacing="2">
      Building Apps Like Thunder
    </text>
  </svg>
</div>

<br>
