name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}    # ← Pakai PAT, bukan GITHUB_TOKEN
          user: ${{ github.repository_owner }}
          template: classic
          base: header, repositories, metadata
          config_timezone: Asia/Jakarta
          
          plugin_calendar: yes
          plugin_calendar_limit: 1
          
          plugin_repositories: yes
          plugin_repositories_featured: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          
          filename: assets/metrics.svg
          output_action: commit
          commit_message: "chore: update metrics [skip ci]"
